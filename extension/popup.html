<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Bookmark Bar Centerer</title>
<style>
  :root {
    --bg: #ffffff; --fg: #1f1f1f; --muted: #6b6b6b; --line: #e3e3e3;
    --btn: #f1f3f4; --btn-h: #e4e6e8; --accent: #1a73e8; --accent-fg: #fff;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #202124; --fg: #e8eaed; --muted: #9aa0a6; --line: #3c4043;
      --btn: #303134; --btn-h: #3c4043; --accent: #8ab4f8; --accent-fg: #202124;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; width: 290px; padding: 16px;
    background: var(--bg); color: var(--fg);
    font: 13px/1.4 system-ui, "Segoe UI", Roboto, sans-serif;
  }
  h1 { font-size: 15px; margin: 0 0 4px; }
  .sub { color: var(--muted); font-size: 12px; margin: 0 0 14px; }
  .box { border: 1px solid var(--line); border-radius: 10px; padding: 12px; margin-bottom: 10px; }
  .top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
  .top span { font-size: 12px; color: var(--muted); }
  input[type=number] {
    width: 78px; font: inherit; font-variant-numeric: tabular-nums; text-align: right;
    color: var(--fg); background: var(--btn);
    border: 1px solid var(--line); border-radius: 6px; padding: 4px 6px;
  }
  input[type=range] { width: 100%; accent-color: var(--accent); margin: 4px 0; cursor: pointer; }
  button {
    font: inherit; color: var(--fg); background: var(--btn);
    border: none; border-radius: 8px; padding: 8px 12px; cursor: pointer;
  }
  button:hover { background: var(--btn-h); }
  .row { display: flex; gap: 8px; }
  .row button { flex: 1; }
  .primary { background: var(--accent); color: var(--accent-fg); font-weight: 600; }
  .primary:hover { background: var(--accent); filter: brightness(1.08); }
  .hint { color: var(--muted); font-size: 11px; margin: 10px 0 0; }
  #status { min-height: 16px; color: var(--muted); font-size: 12px; margin-top: 8px; text-align: center; }
</style>
</head>
<body>
  <h1>Bookmark Bar Centerer</h1>
  <p class="sub">Центрирование панели закладок</p>

  <div class="box">
    <div class="top">
      <span>Разделители</span>
      <input type="number" id="num" min="0" step="1" value="0">
    </div>
    <input type="range" id="slider" min="0" max="60" step="1" value="0">
  </div>

  <div class="row">
    <button class="primary" id="auto">Авто-центр</button>
    <button id="reset">Сброс</button>
  </div>

  <p class="hint">Двигайте ползунок — закладки сдвигаются сразу. Колёсико мыши над ползунком или стрелки в поле — по одному разделителю.</p>
  <div id="status"></div>
  <script src="popup.js"></script>
</body>
</html>
